# Requires /etc/nms-collector/collector.env to set the target values manually.
# Example:
#   *.* action(type="omfwd" target="192.0.2.10" port="5514" protocol="udp")

*.* action(
  type="omfwd"
  target="127.0.0.1"
  port="5514"
  protocol="udp"
  action.resumeRetryCount="-1"
  queue.type="linkedList"
  queue.size="10000"
)
